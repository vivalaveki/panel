<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080808">
<meta name="color-scheme" content="dark">
<title>Dvaes Digital — Prijava</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080808;
  --surface:rgba(255,255,255,.035);
  --surface-2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.11);
  --line-strong:rgba(255,255,255,.28);
  --text:#f2f0eb;
  --muted:#8d8b85;
  --accent:#f2f0eb;
  --accent-ink:#080808;
  --bad:#ff7a85;
  --radius:16px;
  --font:"Manrope",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 15px/1.6 var(--font);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;opacity:.07;mix-blend-mode:screen;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}

.site-header{display:flex;align-items:center;justify-content:space-between;padding:16px clamp(18px,4vw,48px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:baseline;gap:8px;text-decoration:none;font-weight:800;letter-spacing:-.02em;font-size:19px;color:var(--text)}
.logo small{font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}

main{flex:1;display:grid;place-items:center;padding:clamp(28px,6vw,72px) clamp(18px,4vw,48px)}
.login{width:100%;max-width:440px}
.eyebrow{margin:0 0 14px;color:var(--muted);font-weight:600;font-size:13px;letter-spacing:.04em}
h1{margin:0;font-size:clamp(40px,8vw,64px);line-height:1;letter-spacing:-.045em;font-weight:800}
.lead{margin:16px 0 0;color:var(--muted);max-width:36ch}

.panel{margin-top:32px;padding:clamp(18px,3vw,26px);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
.field{display:flex;flex-direction:column;gap:7px}
.field+.field{margin-top:16px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input{width:100%;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;color-scheme:dark;transition:border-color .2s}
.field input:focus{border-color:var(--text)}
.btn{width:100%;margin-top:22px;border:1px solid var(--accent);border-radius:99px;padding:13px 22px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;cursor:pointer;transition:background .2s,border-color .2s}
.btn:hover{background:#fff;border-color:#fff}
.btn:disabled{opacity:.55;cursor:wait}
#err{min-height:1.4em;margin:14px 0 0;font-size:13px;color:var(--bad)}

.site-footer{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:22px clamp(18px,4vw,48px) 84px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
.lang-switch{position:fixed;left:18px;bottom:18px;z-index:60;display:flex;padding:4px;border:1px solid var(--line-strong);border-radius:99px;background:rgba(8,8,8,.88);backdrop-filter:blur(10px)}
.lang-switch__btn{border:0;background:transparent;color:var(--muted);padding:7px 14px;border-radius:99px;font-weight:700;font-size:12px;letter-spacing:.06em;cursor:pointer;transition:background .2s,color .2s}
.lang-switch__btn.is-active{background:var(--accent);color:var(--accent-ink)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="site-header">
  <span class="logo">Dvaes Digital <small data-i18n="logo.sub">Label Desk</small></span>
</header>

<main>
  <div class="login">
    <p class="eyebrow" data-i18n="eyebrow">Label · Albumi · Financije</p>
    <h1 data-i18n="title">Prijava.</h1>
    <p class="lead" data-i18n="lead">Prijavi se za pristup kalkulatoru ulaganja.</p>

    <div class="panel" id="form" role="group" aria-label="Prijava" data-i18n-aria="aria.form">
      <div class="field"><label for="u" data-i18n="user">Korisničko ime</label><input id="u" autocomplete="username" autofocus></div>
      <div class="field"><label for="p" data-i18n="pass">Lozinka</label><input id="p" type="password" autocomplete="current-password"></div>
      <button class="btn" id="btn" type="button" data-i18n="btn">Prijavi se</button>
      <p id="err" role="alert"></p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <span class="logo">Dvaes Digital</span>
  <span>© <span id="year">2026</span> Dvaes Digital</span>
</footer>

<div class="lang-switch" role="group" aria-label="Jezik / Language">
  <button type="button" class="lang-switch__btn" data-lang="hr" lang="hr" title="Hrvatski" aria-pressed="false">HR</button>
  <button type="button" class="lang-switch__btn" data-lang="en" lang="en" title="English" aria-pressed="false">EN</button>
</div>

<script>
const $ = id => document.getElementById(id);
$('year').textContent = new Date().getFullYear();

/* ---------- i18n (isti LANG_KEY kao panel, pa se jezik prenosi) ---------- */
const LANG_KEY = 'dvaesLabelDeskLang';
const T = {
  hr:{ 'logo.sub':'Label Desk','eyebrow':'Label · Albumi · Financije','title':'Prijava.','lead':'Prijavi se za pristup kalkulatoru ulaganja.',
       'aria.form':'Prijava','user':'Korisničko ime','pass':'Lozinka','btn':'Prijavi se','doc':'Dvaes Digital — Prijava',
       'err.empty':'Unesi korisničko ime i lozinku.','err.bad':'Pogrešno korisničko ime ili lozinka.',
       'err.generic':'Greška: {m}. Stranicu otvori preko web servera, ne direktno iz fajla.',
       'err.cred':'credentials.txt nije dostupan','err.panel':'panel.html nije dostupan' },
  en:{ 'logo.sub':'Label Desk','eyebrow':'Label · Albums · Finance','title':'Sign in.','lead':'Sign in to access the investment calculator.',
       'aria.form':'Sign in','user':'Username','pass':'Password','btn':'Sign in','doc':'Dvaes Digital — Sign in',
       'err.empty':'Enter your username and password.','err.bad':'Wrong username or password.',
       'err.generic':'Error: {m}. Open the page through a web server, not directly from a file.',
       'err.cred':'credentials.txt is not available','err.panel':'panel.html is not available' }
};
let lang = 'hr', lastErr = null;           // lastErr = {key, vars} da se poruka prevodi pri promjeni jezika
const t = (k, v) => { let s = T[lang][k] ?? T.hr[k] ?? k; if (v) for (const p in v) s = s.replace('{' + p + '}', v[p]); return s; };

function showErr(key, vars) {
  lastErr = key ? { key, vars } : null;
  if (!key) { $('err').textContent = ''; return; }
  const v = vars && vars.mKey ? { m: t(vars.mKey) } : vars;
  $('err').textContent = t(key, v);
}

function applyLang(l, persist = true) {
  lang = T[l] ? l : 'hr';
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el => el.setAttribute('aria-label', t(el.dataset.i18nAria)));
  document.title = t('doc');
  document.querySelectorAll('.lang-switch__btn').forEach(b => {
    const on = b.dataset.lang === lang; b.classList.toggle('is-active', on); b.setAttribute('aria-pressed', on);
  });
  if (persist) { try { localStorage.setItem(LANG_KEY, lang); } catch (e) {} }
  if (lastErr) showErr(lastErr.key, lastErr.vars);
}
document.querySelectorAll('.lang-switch__btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

let start; try { start = localStorage.getItem(LANG_KEY); } catch (e) {}
if (!T[start]) start = (navigator.language || '').toLowerCase().startsWith('hr') ? 'hr' : 'en';
applyLang(start, false);

/* ---------- Prijava (logika nepromijenjena) ---------- */
// Čita credentials.txt; svaki red: username: [ime], password: [lozinka]
// (zagrade su opcionalne, može više redova = više korisnika)
function parseCredentials(text) {
  const re = /username:\s*\[?(.*?)\]?\s*,\s*password:\s*\[?(.*?)\]?\s*$/i;
  return text.split(/\r?\n/).map(l => l.trim()).filter(Boolean)
    .map(l => l.match(re)).filter(Boolean)
    .map(m => ({ user: m[1], pass: m[2] }));
}

async function login() {
  const user = $('u').value.trim(), pass = $('p').value;
  const btn = $('btn');
  showErr(null);
  if (!user || !pass) { showErr('err.empty'); return; }
  btn.disabled = true;
  try {
    const r = await fetch('credentials.txt', { cache: 'no-store' });
    if (!r.ok) throw new Error('err.cred');
    const ok = parseCredentials(await r.text()).some(c => c.user === user && c.pass === pass);
    if (!ok) { showErr('err.bad'); btn.disabled = false; return; }

    // Uspjeh: tek sad dohvati panel.html i zamijeni stranicu bez redirecta
    const pr = await fetch('panel.html', { cache: 'no-store' });
    if (!pr.ok) throw new Error('err.panel');
    const html = await pr.text();
    document.open(); document.write(html); document.close();
  } catch (e) {
    const known = T.hr[e.message];
    showErr('err.generic', known ? { mKey: e.message } : { m: e.message });
    btn.disabled = false;
  }
}

$('btn').addEventListener('click', login);
['u', 'p'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') login(); }));
</script>
</body>
</html>
